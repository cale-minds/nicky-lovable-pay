name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: Typecheck & unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (pure modules + frontend kit)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  edge:
    name: Deno check (Edge Functions)
    runs-on: ubuntu-latest
    # The Edge Function entrypoints use `Deno.serve` and remote (esm.sh) imports,
    # so they are validated with Deno rather than tsc. `deno check` needs network
    # access to fetch the remote modules. This job is BLOCKING: CI fails if
    # `npm run typecheck:edge` fails. (If you ever hit a transient remote-registry
    # outage, re-run the job rather than making it advisory.)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function entrypoints
        run: npm run typecheck:edge
